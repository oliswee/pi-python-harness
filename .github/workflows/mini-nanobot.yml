name: Mini-Nanobot offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.0"
      - name: Install the locked workspace
        run: uv sync --locked --all-packages --python 3.13
      - name: Smoke the Pi CLI
        run: uv run --locked --package pi-coding-agent pi --help
      - name: Run Mini-Nanobot and Pi Agent tests
        run: uv run --locked pytest -q tests/e2e packages/agent/tests --timeout=50
      - name: Smoke the benchmark runner
        run: uv run --locked python benchmarks/evaluate.py --trials 1 --case B01 --case B09 --output "${{ runner.temp }}/mini-nanobot-eval"
